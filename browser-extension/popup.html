<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Changewatch</title>
    <style>
      body { width: 270px; margin: 0; padding: 18px; background: #fcfcfa; color: #15191d; font: 13px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 8px; font: 600 20px Georgia, serif; } p { color: #66717d; } button { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #15191d; color: white; font-weight: 800; cursor: pointer; }
      small { display: block; margin-top: 12px; color: #7b868d; }
    </style>
  </head>
  <body>
    <h1>Monitor this page</h1>
    <p>Open the current public URL as a pre-filled Changewatch monitor.</p>
    <button id="open">Open in Changewatch</button>
    <small>Changewatch must be running at localhost:3000.</small>
    <script src="popup.js"></script>
  </body>
</html>
